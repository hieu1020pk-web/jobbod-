worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    include /etc/nginx/cloudflare-realip.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_origin $cors_origin { default ''; 'https://jobbod.net' 'https://jobbod.net'; }
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate /etc/letsencrypt/live/jobbod.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobbod.net/privkey.pem;
    client_max_body_size 20m;
    server {
        listen 80 default_server;
        server_name _;
        location = /health/gateway { access_log off; return 200 'ok'; }
        location / { return 404; }
    }
    server {
        listen 80;
        server_name jobbod.net api.jobbod.net;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name jobbod.net;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        add_header Strict-Transport-Security 'max-age=86400' always;
        add_header X-Content-Type-Options nosniff always;
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name api.jobbod.net;
        location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
        add_header Strict-Transport-Security 'max-age=86400' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-CSRF-Token' always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
