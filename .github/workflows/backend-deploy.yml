name: backend deploy
on:
  push:
    branches: [backend/ci-cd]
    paths-ignore: ['.agents/**', 'AGENTS.md', 'CLAUDE.md', 'CHANGELOG.md', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: backend-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hieu1020pk-web/jobbod-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/hieu1020pk-web/jobbod-
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: false
      - name: Deploy and check (one SSH connection)
        env:
          DEPLOY_KEY: ${{ secrets.JOBBOD_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.JOBBOD_KNOWN_HOSTS }}
          IMAGE: ghcr.io/hieu1020pk-web/jobbod-backend@${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/jobbod"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/jobbod"' EXIT
          ssh -i "$HOME/.ssh/jobbod" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 devops@160.187.246.154 "deploy backend $IMAGE"
