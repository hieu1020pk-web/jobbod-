name: Infra images (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        component: [minio, mc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: deploy/minio
          file: deploy/minio/${{ matrix.component == 'minio' && 'Dockerfile' || 'mc.Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hieu1020pk-web/jobbod-${{ matrix.component }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/hieu1020pk-web/jobbod-
          cache-from: type=gha,scope=infra-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=infra-${{ matrix.component }}
          provenance: false
