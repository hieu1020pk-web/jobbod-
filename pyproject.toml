[project]
name = "jobbod-backend"
version = "0.1.0"
description = "Jobbod backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.0",
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
